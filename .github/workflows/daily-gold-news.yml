name: Daily Gold News Generator (Wix)

on:
  schedule:
    # 毎日 UTC 22:00（日本時間 翌朝 07:00）に自動起動（通勤時間帯の閲覧習慣化）
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      post_status:
        description: '投稿ステータスを選択'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - publish

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 依存パッケージのインストール
        run: npm install

      - name: Playwright（Chromium）のセットアップ（チャート画像キャプチャ用）
        run: npx playwright install chromium --with-deps

      - name: ゴールド朝報の生成とWix投稿スクリプトの実行
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          # 共通カテゴリとゴールド専用カテゴリの両方を記事に付与（WIX_GOLD_CATEGORY_ID未設定時は共通のみ）
          WIX_CATEGORY_ID: ${{ secrets.WIX_CATEGORY_ID }}
          WIX_GOLD_CATEGORY_ID: ${{ secrets.WIX_GOLD_CATEGORY_ID }}
          WIX_MEMBER_ID: ${{ secrets.WIX_MEMBER_ID }}
          # Cron実行時は 'publish'、手動実行(GUI)時は選択された値(デフォルト: draft)を適用
          POST_STATUS: ${{ github.event_name == 'schedule' && 'publish' || github.event.inputs.post_status || 'draft' }}
        run: npm run start:gold
